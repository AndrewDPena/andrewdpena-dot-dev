name: CI

on:
  push:
    branches: [main]
  pull_request:

# If you push again before a run finishes, cancel the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  image:
    name: Build and push arm64 image
    needs: check
    # Only publish images from main, never from pull requests.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Native ARM runner (free for public repos), so no slow emulation.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/andrewdpena/andrewdpena-dot-dev
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuse layers between runs (GitHub's cache), so unchanged
          # dependencies aren't reinstalled every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max
